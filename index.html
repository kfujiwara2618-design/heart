<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Professional Luxury Hanami AR Camera</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* スマホカメラ映像（ズームはCSS transformでカメラのみに適用、ARは独立） */
    #webcam-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
    }
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1);
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    /* AR演出・フレームを重ねるレイヤー（カメラのズームに影響されない独立レイヤー） */
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    /* ラグジュアリーなステータス表示 */
    #info-overlay {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: #f7f3ed;
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      font-size: 10px;
      letter-spacing: 0.1em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }

    /* プロ仕様カメラコントロールパネル（ズーム ＆ タイマー） */
    #pro-controls {
      position: absolute;
      top: 65px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .control-group {
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(228, 195, 139, 0.35);
      border-radius: 12px;
      padding: 6px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
    .ctrl-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.4);
      color: #f7f3ed;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ctrl-btn.active {
      background: rgba(228, 195, 139, 0.9);
      color: #000;
      font-weight: bold;
      border-color: #e4c38b;
    }
    .ctrl-label {
      color: #e4c38b;
      font-size: 9px;
      letter-spacing: 0.08em;
      margin-right: 2px;
      font-weight: 500;
    }

    /* 詳細調整スライダー（フレームサイズ ＆ エフェクト強弱） */
    #sliders-container {
      position: absolute;
      bottom: 135px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 15, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(228, 195, 139, 0.35);
      border-radius: 16px;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      width: 270px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f7f3ed;
      font-size: 10px;
      letter-spacing: 0.05em;
    }
    .slider-row span {
      color: #e4c38b;
      font-weight: 500;
      width: 90px;
    }
    .slider-row input[type=range] {
      flex: 1;
      accent-color: #e4c38b;
      height: 4px;
      cursor: pointer;
    }

    /* タイマーカウントダウン表示オーバーレイ */
    #countdown-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #countdown-number {
      font-size: 110px;
      font-weight: 300;
      color: #f7f3ed;
      text-shadow: 0 0 35px rgba(228,195,139,0.9);
      letter-spacing: 0.05em;
    }

    /* 最高級メタリック調のシャッターボタン */
    #shutter-container {
      position: absolute;
      bottom: 35px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- スマホのカメラ映像（ズーム適用コンテナ） -->
  <div id="webcam-container">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <!-- ARレイヤー（カメラズームとは完全に独立） -->
  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <!-- ガイド・ステータス表示 -->
  <div id="info-overlay">
    <div>PRO CAMERA: <span id="status">READY</span></div>
  </div>

  <!-- プロ仕様カメラコントロールパネル（ズーム ＆ タイマー） -->
  <div id="pro-controls">
    <div class="control-group">
      <span class="ctrl-label">ZOOM</span>
      <button class="ctrl-btn active" onclick="setZoom(1)">1.0x</button>
      <button class="ctrl-btn" onclick="setZoom(1.5)">1.5x</button>
      <button class="ctrl-btn" onclick="setZoom(2.0)">2.0x</button>
    </div>
    <div class="control-group">
      <span class="ctrl-label">TIMER</span>
      <button class="ctrl-btn active" onclick="setTimer(0)">OFF</button>
      <button class="ctrl-btn" onclick="setTimer(3)">3s</button>
      <button class="ctrl-btn" onclick="setTimer(5)">5s</button>
    </div>
  </div>

  <!-- 詳細調整スライダー（フレームサイズ ＆ エフェクト強弱） -->
  <div id="sliders-container">
    <div class="slider-row">
      <span>FRAME SIZE</span>
      <input type="range" id="scaleSlider" min="0.5" max="2.0" step="0.05" value="1.0">
    </div>
    <div class="slider-row">
      <span>EFFECT INTENSITY</span>
      <input type="range" id="intensitySlider" min="0.2" max="2.0" step="0.1" value="1.0">
    </div>
  </div>

  <!-- タイマーカウントダウン画面 -->
  <div id="countdown-overlay">
    <div id="countdown-number">3</div>
  </div>

  <!-- シャッターボタン -->
  <div id="shutter-container">
    <button id="shutter-btn" title="Capture" onclick="triggerShutter()"></button>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const scaleSlider = document.getElementById('scaleSlider');
    const intensitySlider = document.getElementById('intensitySlider');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const countdownNumber = document.getElementById('countdown-number');

    let currentZoom = 1.0;
    let currentTimer = 0; // 秒数 (0, 3, 5)
    let frameScale = 1.0;
    let effectIntensity = 1.0;

    // ズーム設定（カメラ映像にのみ影響し、ARには干渉しない）
    function setZoom(zoom) {
      currentZoom = zoom;
      webcamEl.style.transform = `scale(${zoom})`;
      
      document.querySelectorAll('#pro-controls .control-group:nth-child(1) .ctrl-btn').forEach(btn => {
        btn.classList.remove('active');
        if(btn.textContent.includes(zoom.toFixed(1) + 'x')) {
          btn.classList.add('active');
        }
      });
      statusEl.textContent = `ZOOM ${zoom.toFixed(1)}X`;
    }

    // タイマー設定
    function setTimer(sec) {
      currentTimer = sec;
      document.querySelectorAll('#pro-controls .control-group:nth-child(2) .ctrl-btn').forEach(btn => {
        btn.classList.remove('active');
        if((sec === 0 && btn.textContent === 'OFF') || btn.textContent === sec + 's') {
          btn.classList.add('active');
        }
      });
      statusEl.textContent = sec === 0 ? 'READY' : `TIMER ${sec}s`;
    }

    // スライダー操作の連動
    scaleSlider.addEventListener('input', (e) => {
      frameScale = parseFloat(e.target.value);
    });
    intensitySlider.addEventListener('input', (e) => {
      effectIntensity = parseFloat(e.target.value);
    });

    // --- 高解像度 (Retina) 対応のCanvasリサイズ処理 ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // カメラ（背面カメラ優先）の起動
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        webcamEl.srcObject = stream;
        statusEl.textContent = "READY";
      } catch (err) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
          webcamEl.srcObject = stream;
          statusEl.textContent = "READY";
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }
    initCamera();

    // 1.png を読み込み、白背景を高精度透過処理する
    let processedFrameImg = null;
    function loadAndProcessFrame() {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.naturalWidth || img.width;
        tempCanvas.height = img.naturalHeight || img.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(img, 0, 0);

        const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          if (r > 200 && g > 200 && b > 200) {
            data[i+3] = 0; 
          }
        }
        tempCtx.putImageData(imgData, 0, 0);
        processedFrameImg = tempCanvas;
      };
      img.onerror = () => { console.warn("1.png load failed"); };
      img.src = '1.png';
    }
    loadAndProcessFrame();

    // パーティクル設定（桜 ＆ ゴールドスパークル）
    const particles = [];
    for (let i = 0; i < 60; i++) {
      particles.push({
        type: i < 35 ? 'petal' : 'sparkle',
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: i < 35 ? (Math.random() * 12 + 8) : (Math.random() * 3.5 + 1.2),
        speedY: (Math.random() * 1.4 + 0.7) * (i < 35 ? 1 : 0.6),
        speedX: (Math.random() - 0.5) * 1.2,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 2.0,
        swaySpeed: Math.random() * 0.012 + 0.006,
        swayAmp: Math.random() * 40 + 20,
        initialX: Math.random() * window.innerWidth,
        opacity: Math.random() * 0.35 + 0.65,
        colorVariant: Math.random() > 0.4 ? '#ffb7c5' : '#ffd1dc'
      });
    }

    let timeCount = 0;

    function drawPetal(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.globalAlpha = p.opacity;

      const grad = ctx.createRadialGradient(0, -p.size * 0.2, 0, 0, 0, p.size * 1.2);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, p.colorVariant);
      grad.addColorStop(1, '#ff7b93');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, -p.size);
      ctx.bezierCurveTo(p.size * 0.9, -p.size * 1.4, p.size * 1.2, p.size * 0.4, 0, p.size * 1.1);
      ctx.bezierCurveTo(-p.size * 1.2, p.size * 0.4, -p.size * 0.9, -p.size * 1.4, 0, -p.size);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(0, -p.size * 0.7);
      ctx.lineTo(0, p.size * 0.3);
      ctx.stroke();

      ctx.restore();
    }

    function renderLoop() {
      timeCount += 0.016;
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // --- フレーム描画（スライダーのサイズ変更・強弱に連動） ---
      const floatOffsetY = Math.sin(timeCount * 1.5) * 6;
      const baseW = Math.min(logicalWidth * 0.75, 420) * frameScale;
      const baseH = baseW * 1.414;
      const frameX = (logicalWidth - baseW) / 2;
      const frameY = (logicalHeight - baseH) / 2 + floatOffsetY;

      if (processedFrameImg) {
        ctx.save();
        ctx.shadowColor = 'rgba(228, 195, 139, 0.65)';
        ctx.shadowBlur = 35 * effectIntensity;
        ctx.drawImage(processedFrameImg, frameX, frameY, baseW, baseH);
        ctx.restore();
      } else {
        ctx.strokeStyle = 'rgba(228, 195, 139, 0.85)';
        ctx.lineWidth = 5;
        ctx.strokeRect(frameX, frameY, baseW, baseH);
      }

      // --- パーティクル描画（エフェクト強弱 intensity連動） ---
      const activeCount = Math.floor(particles.length * Math.min(effectIntensity, 1.5));
      for(let i = 0; i < activeCount; i++) {
        let p = particles[i];
        p.y += p.speedY * (0.5 + effectIntensity * 0.5);
        if (p.type === 'petal') {
          p.x = p.initialX + Math.sin(p.y * p.swaySpeed) * p.swayAmp;
          p.rotation += p.rotSpeed;

          if (p.y > logicalHeight + 40) {
            p.y = -40;
            p.initialX = Math.random() * logicalWidth;
          }
          drawPetal(ctx, p);
        } else if (p.type === 'sparkle') {
          p.x += p.speedX;
          const pulse = 0.5 + Math.sin(timeCount * 5 + i * 1.5) * 0.5;
          const currentAlpha = Math.max(0, p.opacity * pulse * effectIntensity);

          if (p.y > logicalHeight + 20) {
            p.y = -20;
            p.x = Math.random() * logicalWidth;
          }

          ctx.save();
          ctx.globalAlpha = currentAlpha;
          ctx.fillStyle = '#ffea9f';
          ctx.shadowColor = '#fff3bf';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * Math.sqrt(effectIntensity), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // 2本指ピンチ操作によるフレームサイズ変更
    let initialDistance = null;
    let initialScale = 1.0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = frameScale;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        frameScale = Math.max(0.4, Math.min(2.5, initialScale * factor));
        scaleSlider.value = frameScale;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialDistance = null;
      }
    });

    // シャッターボタン＆タイマー制御
    function triggerShutter() {
      if (currentTimer > 0) {
        startCountdown(currentTimer, executeCapture);
      } else {
        executeCapture();
      }
    }

    function startCountdown(seconds, callback) {
      let remaining = seconds;
      countdownNumber.textContent = remaining;
      countdownOverlay.style.opacity = '1';

      const timerInterval = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          countdownNumber.textContent = remaining;
        } else {
          clearInterval(timerInterval);
          countdownOverlay.style.opacity = '0';
          callback();
        }
      }, 1000);
    }

    // 撮影・合成保存処理（カメラのズーム倍率とARエフェクトを正確に合成）
    function executeCapture() {
      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;
      
      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ背景映像を高画質描画（ズームを正確に反映）
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vRatio = webcamEl.videoWidth / webcamEl.videoHeight;
        const cRatio = logicalWidth / logicalHeight;
        let w = logicalWidth, h = logicalHeight, x = 0, y = 0;
        if (vRatio > cRatio) {
          w = logicalHeight * vRatio;
          x = (logicalWidth - w) / 2;
        } else {
          h = logicalWidth / vRatio;
          y = (logicalHeight - h) / 2;
        }

        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        
        saveCtx.drawImage(webcamEl, x, y, w, h);
        saveCtx.restore();
      }

      // 2. 現在のAR演出（透過フレーム ＆ 桜・スパークル）を合成
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. 超高画質PNGとしてダウンロード保存
      const link = document.createElement('a');
      link.download = 'pro_luxury_hanami_' + Date.now() + '.png';
      link.href = saveCanvas.toDataURL('image/png', 1.0);
      link.click();
      
      statusEl.textContent = "SAVED";
      setTimeout(() => { statusEl.textContent = "READY"; }, 1500);
    }
  </script>
</body>
</html>
