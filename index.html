<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Luxury Pro AR Camera - Heart HD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }
    /* スマホカメラ映像（ズームはビデオ要素のみに干渉） */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    /* AR演出・フレームを重ねるレイヤー */
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    /* 高解像度対応Canvas */
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    /* ラグジュアリーなトップコントロールバー */
    #top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 10px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .control-btn.active {
      background: #e4c38b;
      color: #1a1a1a;
      border-color: #e4c38b;
      font-weight: 600;
    }
    .control-btn:active {
      transform: scale(0.95);
    }

    /* ステータス表示 */
    #info-overlay {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.75);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }

    /* 最高級メタリック調のシャッターボタン＆下部コントロール */
    #shutter-container {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- スマホのカメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- 上部プロフェッショナルコントロールパネル -->
  <div id="top-controls">
    <button class="control-btn active" id="zoom-1x" onclick="setZoom(1)">1x</button>
    <button class="control-btn" id="zoom-2x" onclick="setZoom(2)">2x</button>
    <button class="control-btn" id="zoom-3x" onclick="setZoom(3)">3x</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" id="effect-btn" onclick="toggleEffectPower()">FX: Mid</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    PRO MODE: <span id="status">READY</span> | フレームはドラッグで移動・2本指で拡大縮小
  </div>

  <!-- ARレイヤー -->
  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <!-- シャッターボタン -->
  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');

    // --- カメラ＆ズーム・切り替えの状態管理 ---
    let currentZoom = 1;
    let useFrontCamera = false;
    let currentStream = null;

    function setZoom(level) {
      currentZoom = level;
      webcamEl.style.transform = `scale(${currentZoom})`;
      ['1x', '2x', '3x'].forEach(z => {
        const btn = document.getElementById(`zoom-${z}`);
        if (btn) btn.classList.toggle('active', z === `${level}x`);
      });
    }

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;
        statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      } catch (err) {
        // フォールバック
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;
          statusEl.textContent = "READY";
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    initCamera();

    // --- 高解像度 (Retina) 対応のCanvasリサイズ処理 ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- フレーム画像処理の削除 ---
    // (1.pngの読み込み、処理、関連変数を削除)

    // --- フレームの位置・サイズ・タッチ操作（ドラッグ＆ピンチ）の管理 ---
    let frameScale = 1.0;
    let frameOffsetX = 0; // 画面中心からのオフセットX
    let frameOffsetY = 0; // 画面中心からのオフセットY

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    let initialDistance = null;
    let initialScale = 1.0;

    // エフェクト強弱設定 (1: Low, 2: Mid, 3: High)
    let effectPowerLevel = 2;
    function toggleEffectPower() {
      effectPowerLevel = (effectPowerLevel % 3) + 1;
      const names = { 1: 'Low', 2: 'Mid', 3: 'High' };
      document.getElementById('effect-btn').textContent = `FX: ${names[effectPowerLevel]}`;
    }

    // タッチ・マウス操作イベント（フレームのドラッグ移動 ＆ 2本指ピンチ拡大縮小）
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX - frameOffsetX;
        dragStartY = e.touches[0].clientY - frameOffsetY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = frameScale;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        frameOffsetX = e.touches[0].clientX - dragStartX;
        frameOffsetY = e.touches[0].clientY - dragStartY;
      } else if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        frameScale = Math.max(0.4, Math.min(2.5, initialScale * factor));
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) isDragging = false;
      if (e.touches.length < 2) initialDistance = null;
    });

    // --- ハートパーティクルシステム（色とりどりパステルカラー、サイズ違い） ---
    const particles = [];
    const pastelColors = ['#FFB6C1', '#FFD1DC', '#FFCCFF', '#E6E6FA', '#D8BFD8', '#B0E0E6', '#98FB98', '#FFFFE0']; // 7色+αのパステル

    for (let i = 0; i < 70; i++) {
      particles.push({
        type: 'heart',
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 15 + 6, // サイズ違い
        speedY: Math.random() * 1.6 + 0.6,
        speedX: (Math.random() - 0.5) * 1.0,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 1.8,
        opacity: Math.random() * 0.4 + 0.5,
        color: pastelColors[Math.floor(Math.random() * pastelColors.length)] // 初期色（描画時に上書き）
      });
    }

    let timeCount = 0;

    // ハート描画関数
    function drawHeart(ctx, x, y, size, color, opacity) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((timeCount * 0.2) + x * 0.01); // 軽く揺らす
      ctx.globalAlpha = opacity;
      ctx.fillStyle = color;
      ctx.beginPath();
      const d = size / 2;
      ctx.moveTo(0, d / 2);
      ctx.bezierCurveTo(0, 0, d, 0, d, d / 2);
      ctx.bezierCurveTo(d, d, 0, d * 1.5, 0, size);
      ctx.bezierCurveTo(0, d * 1.5, -d, d, -d, d / 2);
      ctx.bezierCurveTo(-d, 0, 0, 0, 0, d / 2);
      ctx.fill();
      ctx.restore();
    }

    // --- メイン描画ループ ---
    function renderLoop() {
      timeCount += 0.016;
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // --- A. フレームの描画（色変化矩形のみ） ---
      const floatOffsetY = Math.sin(timeCount * 1.5) * 6;
      const baseW = Math.min(logicalWidth * 0.75, 420) * frameScale;
      const baseH = baseW * 1.414; // アスペクト比
      const frameX = (logicalWidth - baseW) / 2 + frameOffsetX;
      const frameY = (logicalHeight - baseH) / 2 + floatOffsetY + frameOffsetY;

      // ゆっくり7色に変化させるロジック (HSLを使用)
      const frameHue = (timeCount * 40) % 360; // 変化速度
      const frameColor = 'hsl(' + frameHue + ', 80%, 75%)'; // パステル調

      ctx.save();
      ctx.shadowColor = 'hsl(' + frameHue + ', 80%, 65%)'; // 影の色も合わせる
      ctx.shadowBlur = 45;

      // 矩形フレーム描画
      ctx.strokeStyle = frameColor;
      ctx.lineWidth = 5;
      ctx.strokeRect(frameX, frameY, baseW, baseH);

      ctx.restore();

      // --- B. パーティクルの描写（ハートエフェクト） ---
      const activeCount = effectPowerLevel === 1 ? 0.4 : (effectPowerLevel === 2 ? 0.7 : 1.2);

      // ハート全体の色変化用の基準色相 (ゆっくり)
      const heartBaseHue = (timeCount * 20) % 360; 

      particles.forEach((p, index) => {
        // 動きの更新
        p.y += p.speedY * activeCount;
        p.x += p.speedX * activeCount * 0.5;
        p.rotation += p.rotSpeed * activeCount;

        // 画面外リセット
        if (p.y > logicalHeight + 40 || p.x < -40 || p.x > logicalWidth + 40) {
          p.y = -40;
          p.x = Math.random() * logicalWidth;
          // 初期色は設定したままで、描画時にHSLで計算する
        }

        // ハート描画
        if (effectPowerLevel > 0) {
          // パーティクルごとの色計算（色とりどり + ゆっくり全体変化）
          const currentHue = (heartBaseHue + index * 10 + p.x * 0.1) % 360; // インデックスと位置でオフセット
          const color = `hsl(${currentHue}, 70%, 80%)`; // パステル調
          drawHeart(ctx, p.x, p.y, p.size, color, p.opacity);
        }
      });

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- シャッター機能（カメラズーム・フレーム位置を正確に合成して保存） ---
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;
      
      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ映像（ズーム状態を反映して正確に切り抜いて描画）
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        // ズーム（scale）を反映した領域計算
        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
        saveCtx.restore();
      }

      // 2. 現在のAR演出（移動・サイズ変更されたフレーム ＆ ハートエフェクト）を合成
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. 超高画質保存
      const link = document.createElement('a');
      link.download = 'luxury_pro_heart_' + Date.now() + '.png';
      link.href = saveCanvas.toDataURL('image/png', 1.0);
      link.click();
    });
  </script>
</body>
</html>
